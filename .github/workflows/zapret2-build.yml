name: build-luci-app-zapret2-ipk
run-name: Build luci-app-zapret2 .ipk (OpenWrt SDK)

on:
  workflow_dispatch:
  push:
    branches:
      - development
    tags:
      - 'v[0-9]+*'

env:
  REPO_NAME: luci-app-zapret2

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: 24.10.8
            arch: aarch64_cortex-a53
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: carp4/luci-app-zapret2
          ref: development
          path: ${{ env.REPO_NAME }}

      - name: Fix SDK paths
        working-directory: /builder
        run: |
          mkdir -p /builder/shared-workdir
          rm -rf /builder/shared-workdir/build
          ln -sf /builder /builder/shared-workdir/build

      - name: Copy package into SDK
        working-directory: /builder
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          mkdir -p package/$REPO_NAME
          if [ -d "$GITHUB_WORKSPACE/$REPO_NAME" ]; then
            SRC="$GITHUB_WORKSPACE/$REPO_NAME"
          elif [ -d "/github/workspace/$REPO_NAME" ]; then
            SRC="/github/workspace/$REPO_NAME"
          else
            echo "Could not locate checkout of $REPO_NAME"; ls -la; exit 1
          fi
          echo "copying project from $SRC"
          cp -va "$SRC"/. package/$REPO_NAME/

      - name: Init feeds
        working-directory: /builder
        run: |
          mv feeds.conf.default feeds.conf
          sed -i -e 's|base.*\.git|base https://github.com/openwrt/openwrt.git|' feeds.conf
          sed -i -e 's|packages.*\.git|packages https://github.com/openwrt/packages.git|' feeds.conf
          sed -i -e 's|luci.*\.git|luci https://github.com/openwrt/luci.git|' feeds.conf
          ./scripts/feeds update base packages luci
          ./scripts/feeds install -a

      - name: Init config
        working-directory: /builder
        run: |
          make defconfig

      - name: Build luci-app-zapret2 package
        working-directory: /builder
        run: |
          make package/luci-app-zapret2/compile V=sc BUILD_LOG=1 MAKEFLAGS="-j$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/ipk-out
          find /builder/bin/packages -name "luci-app-zapret2_*.ipk" -exec cp {} /tmp/ipk-out/ \;
          ls -la /tmp/ipk-out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-zapret2-ipk-${{ matrix.arch }}-${{ matrix.branch }}
          path: /tmp/ipk-out/*.ipk
